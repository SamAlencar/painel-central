name: Validar

on:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python3 -m pip install -r requirements.txt
      - run: python3 scripts/testar.py
      - run: python3 scripts/validar.py
      - run: npm ci
      - run: npm run build
      - name: Build com caminhos relativos
        run: python3 scripts/checar_build.py
